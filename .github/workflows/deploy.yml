name: Deploy

on:
  push:
    branches: [deploy]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, laravel]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner
        run: |
          echo "Hostname: $(hostname)"
          echo "Docker: $(docker --version)"

      - name: Deploy
        run: |
          rsync -a --delete \
            --exclude '.env' \
            --exclude '.git' \
            --exclude 'vendor' \
            --exclude 'node_modules' \
            --exclude 'public/build' \
            --exclude 'storage' \
            --exclude 'bootstrap/cache' \
            "$GITHUB_WORKSPACE/" \
            /home/fazley/apps/learn-arabic/
          cd /home/fazley/apps/learn-arabic/
          docker compose -f docker-compose.prod.yml up -d --build

      - name: Post-deploy
        run: |
          docker exec learn-arabic php artisan migrate --force
          docker exec learn-arabic php artisan db:seed --class=TopQuranicVocabularySeeder --force || true
          docker exec learn-arabic php artisan config:cache
          docker exec learn-arabic php artisan route:cache
          docker exec learn-arabic php artisan view:cache

      - name: Health check
        run: |
          docker compose -f /home/fazley/apps/learn-arabic/docker-compose.prod.yml ps

