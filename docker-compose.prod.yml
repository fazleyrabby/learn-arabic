services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learn-arabic
    restart: unless-stopped
    command: sh -c "chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache && chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache && exec /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.learn-arabic.rule=Host(`learnarabic.fazleyrabbi.xyz`)"
      - "traefik.http.routers.learn-arabic.entrypoints=web"
      - "traefik.http.services.learn-arabic.loadbalancer.server.port=80"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: learn-arabic-db
      DB_PORT: "5432"
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      - traefik
      - learn-arabic

  db:
    image: postgres:17-alpine
    container_name: learn-arabic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-learn_arabic}
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learn-arabic

volumes:
  pgsql_data:

networks:
  traefik:
    external: true
  learn-arabic:
    driver: bridge
